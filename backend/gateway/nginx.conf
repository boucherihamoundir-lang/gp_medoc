worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 50M;

    # Upstreams vers les 6 microservices Django
    upstream user_service_upstream {
        server user_service:8001;
    }

    upstream doctor_service_upstream {
        server doctor_service:8002;
    }

    upstream patient_service_upstream {
        server patient_service:8003;
    }

    upstream appointment_service_upstream {
        server appointment_service:8004;
    }

    upstream chat_service_upstream {
        server chat_service:8005;
    }

    upstream prescription_service_upstream {
        server prescription_service:8006;
    }

    server {
        listen 80;
        server_name localhost;

        # En-têtes CORS universels pour le frontend Web / PWA
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;
        add_header 'Access-Control-Expose-Headers' 'Content-Length,Content-Range' always;

        if ($request_method = 'OPTIONS') {
            return 204;
        }

        # Health Check
        location /health {
            return 200 '{"status":"healthy","service":"MEDOC API Gateway"}';
            add_header Content-Type application/json;
        }

        # 1. User & Auth Service
        location /api/v1/auth/ {
            proxy_pass http://user_service_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 2. Doctor Service
        location /api/v1/doctors/ {
            proxy_pass http://doctor_service_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 3. Patient & Medical Record Service
        location /api/v1/patients/ {
            proxy_pass http://patient_service_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 4. Appointment & Agenda Service
        location /api/v1/appointments/ {
            proxy_pass http://appointment_service_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 5. Chat REST API
        location /api/v1/chats/ {
            proxy_pass http://chat_service_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 5. Chat Real-time WebSockets
        location /ws/ {
            proxy_pass http://chat_service_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # 6. Prescription & Medical Document Service
        location /api/v1/prescriptions/ {
            proxy_pass http://prescription_service_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
